<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShopLab · Tienda de prueba</title>

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#c2410c" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <header class="topbar">
    <div class="topbar__inner">
      <a class="brand" href="#" id="brand-link">
        <span class="brand__mark">S</span>
        <span class="brand__name">ShopLab</span>
      </a>

      <div class="search-bar">
        <span class="search-bar__icon" aria-hidden="true">🔍</span>
        <input type="search" id="search-input" class="search-bar__input" placeholder="Buscar productos..." autocomplete="off" />
      </div>

      <nav class="nav" id="nav">
        <button class="nav__btn active" data-view="tienda">Tienda</button>
        <button class="nav__btn" data-view="favoritos">Favoritos <span class="count" id="fav-count">0</span></button>
        <button class="nav__btn" data-view="carrito">Carrito <span class="count" id="cart-count">0</span></button>
      </nav>
    </div>
  </header>

  <div class="banner" id="banner" hidden>
    <span class="banner__label mono">API · quotes</span>
    <span id="banner-text"></span>
  </div>

  <main class="content">

    <!-- Vista: Tienda -->
    <section id="view-tienda" class="view">
      <div class="toolbar">
        <div class="toolbar__left">
          <select id="filter-categoria" class="select-input">
            <option value="">Todas las categorías</option>
          </select>
          <select id="filter-orden" class="select-input">
            <option value="">Orden por defecto</option>
            <option value="price-asc">Precio: menor a mayor</option>
            <option value="price-desc">Precio: mayor a menor</option>
            <option value="rating-desc">Mejor calificados</option>
            <option value="title-asc">Nombre A–Z</option>
          </select>
        </div>
        <span class="toolbar__info mono" id="result-info"></span>
      </div>

      <div id="products-grid" class="products-grid"></div>

      <div id="status-box" class="status-box" hidden></div>

      <div class="load-more-wrap">
        <button id="load-more" class="btn-secondary" hidden>Cargar más productos</button>
      </div>
    </section>

    <!-- Vista: Favoritos -->
    <section id="view-favoritos" class="view" hidden>
      <h1 class="view-title">Favoritos</h1>
      <div id="favs-grid" class="products-grid"></div>
      <p id="favs-empty" class="empty-state" hidden>Aún no tienes favoritos. Toca el corazón de un producto para guardarlo.</p>
    </section>

    <!-- Vista: Carrito -->
    <section id="view-carrito" class="view" hidden>
      <h1 class="view-title">Tu carrito</h1>
      <div id="cart-content"></div>
    </section>

  </main>

  <!-- Detalle de producto -->
  <div id="detail-overlay" class="detail-overlay" hidden>
    <div class="detail-panel" role="dialog" aria-modal="true" aria-labelledby="detail-title">
      <button id="detail-close" class="detail-close" aria-label="Cerrar">✕</button>
      <div id="detail-content"></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <footer class="footer mono">
    Datos de DummyJSON · tipo de cambio de Frankfurter · <span id="rate-info">cargando tipo de cambio…</span>
  </footer>

  <script src="js/app.js"></script>
  <script src="js/register-sw.js"></script>
</body>
</html>
