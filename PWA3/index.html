<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow · Gestor de Tareas</title>

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#4f46e5" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <header class="topbar">
    <div class="topbar__brand">
      <span class="topbar__logo">✅</span>
      <span class="topbar__title">TaskFlow</span>
    </div>
  </header>

  <main class="content">

    <!-- Panel de totales -->
    <section class="stats-row" id="stats-row">
      <div class="stat-card">
        <span class="stat-card__value" id="stat-total">0</span>
        <span class="stat-card__label">Tareas totales</span>
      </div>
      <div class="stat-card">
        <span class="stat-card__value" id="stat-pendientes">0</span>
        <span class="stat-card__label">Pendientes</span>
      </div>
      <div class="stat-card">
        <span class="stat-card__value" id="stat-completadas">0</span>
        <span class="stat-card__label">Completadas</span>
      </div>
    </section>

    <div class="layout">

      <!-- Formulario de nueva tarea -->
      <section class="panel form-panel">
        <h2>Nueva tarea</h2>
        <form id="task-form">
          <label for="f-titulo">Título</label>
          <input type="text" id="f-titulo" class="text-input" placeholder="Ej. Entregar reporte de laboratorio" required />

          <label for="f-descripcion">Descripción</label>
          <textarea id="f-descripcion" class="textarea-input" placeholder="Detalles de la tarea (opcional)"></textarea>

          <label for="f-fecha">Fecha límite</label>
          <input type="date" id="f-fecha" class="text-input" required />

          <label for="f-categoria">Categoría</label>
          <select id="f-categoria" class="select-input select-input--block">
            <option value="escuela">Escuela</option>
            <option value="trabajo">Trabajo</option>
            <option value="personal">Personal</option>
            <option value="otro">Otro</option>
          </select>

          <label>Prioridad</label>
          <div class="priority-options" id="priority-options">
            <button type="button" class="priority-btn priority-btn--urgente" data-priority="urgente">Urgente</button>
            <button type="button" class="priority-btn priority-btn--media" data-priority="media">Media</button>
            <button type="button" class="priority-btn priority-btn--baja" data-priority="baja">Baja</button>
          </div>

          <button type="submit" class="btn-primary">Agregar tarea</button>
        </form>
      </section>

      <!-- Mis tareas -->
      <section class="panel tasks-panel">
        <div class="tasks-panel__header">
          <h2>Mis tareas</h2>
        </div>

        <div class="search-bar">
          <span class="search-bar__icon">🔍</span>
          <input type="text" id="search-input" class="search-bar__input" placeholder="Buscar por título o descripción..." autocomplete="off" />
        </div>

        <div class="filters">
          <select class="select-input" id="filter-categoria">
            <option value="todas">Todas las categorías</option>
            <option value="escuela">Escuela</option>
            <option value="trabajo">Trabajo</option>
            <option value="personal">Personal</option>
            <option value="otro">Otro</option>
          </select>
          <select class="select-input" id="filter-estado">
            <option value="todos">Todos los estados</option>
            <option value="pendiente">Pendiente</option>
            <option value="en_curso">En curso</option>
            <option value="completada">Completada</option>
          </select>
        </div>

        <ul id="tasks-list" class="tasks-list">
          <!-- Los <li> de cada tarea se generan e insertan aquí vía innerHTML -->
        </ul>

        <p id="empty-state" class="empty-state" hidden>No hay tareas que coincidan.</p>
      </section>

    </div>
  </main>

  <script src="js/app.js"></script>
  <script src="js/register-sw.js"></script>
</body>
</html>
